# The code has type annotations. Enforce correctness of those.

name: Mypy (type checking)

on:
  # Only the long-lived branches: topic and dependabot branches live in this
  # repository, so a push there would run this twice -- once for the push and
  # once for the pull request.
  push:
    branches: [master, develop]
  pull_request:
  # Called by the release workflow, which gates publishing on this check.
  workflow_call:

# Superseded commits do not need to finish.
concurrency:
  # A literal, not github.workflow: that resolves to the *caller's* name when
  # one workflow calls another, so every check the release calls would share
  # one group and cancel its siblings.
  group: mypy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported versions, plus 3.15: until 3.15.0 is
        # out, allow-prereleases resolves it to the latest release candidate.
        # It has to pass like any other version.
        python-version: ['3.11', '3.14', '3.15']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install Mypy
      run: |
        python -m pip install --upgrade pip
        pip install mypy

    - name: Check code with Mypy
      run: mypy userprovided/
