# The code has type annotations. Enforce correctness of those.

name: Mypy (type checking)

on:
  push:
  pull_request:
  # Called by the release workflow, which gates publishing on this check.
  workflow_call:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']  # Test oldest and newest supported versions
        experimental: [false]
        include:
          # Pre-release: allowed to fail without breaking CI.
          - python-version: '3.15'
            experimental: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install Mypy
      run: |
        python -m pip install --upgrade pip
        pip install mypy

    - name: Check code with Mypy
      run: mypy userprovided/
