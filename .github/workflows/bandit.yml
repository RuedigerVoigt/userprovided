name: Bandit Security Check

on:
  # Only the long-lived branches: topic and dependabot branches live in this
  # repository, so a push there would run this twice -- once for the push and
  # once for the pull request.
  push:
    branches: [master, develop]
  pull_request:
  # Called by the release workflow, which gates publishing on this check.
  workflow_call:

# Superseded commits do not need to finish.
concurrency:
  # A literal, not github.workflow: that resolves to the *caller's* name when
  # one workflow calls another, so every check the release calls would share
  # one group and cancel its siblings.
  group: bandit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'

    - name: Install Bandit
      run: |
        python -m pip install --upgrade pip
        pip install bandit

    - name: Run Bandit Security Analysis
      run: bandit -r userprovided/ --exclude tests/
