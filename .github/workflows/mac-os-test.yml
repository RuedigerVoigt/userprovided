# This workflow runs Unit-Tests for userprovided on MacOS
# with the oldest and latest supported python versions.

name: MacOS Test

on:
  # Only the long-lived branches: topic and dependabot branches live in this
  # repository, so a push there would run this twice -- once for the push and
  # once for the pull request.
  push:
    branches: [master, develop]
  pull_request:

# Superseded commits do not need to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    runs-on: macos-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
        experimental: [false]
        include:
          # Pre-release: allowed to fail without breaking CI.
          - python-version: '3.15'
            experimental: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Install test tools
      run: |
        pip install hypothesis
        pip install pytest

    - name: Install package
      run: pip install -e .

    - name: Run Pytest
      run: pytest tests/
