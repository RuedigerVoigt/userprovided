name: Poetry Build

on:
  # Only the long-lived branches: topic and dependabot branches live in this
  # repository, so a push there would run this twice -- once for the push and
  # once for the pull request.
  push:
    branches: [master, develop]
  pull_request:

# Superseded commits do not need to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry twine
    - name: Build package
      run: poetry build
    - name: Validate package
      run: |
        twine check --strict dist/*
        test "$(ls dist/*.whl | wc -l)" -eq 1
        test "$(ls dist/*.tar.gz | wc -l)" -eq 1
    # The release workflow runs this too, against the artifact it ships. Here
    # it catches a packaging regression on the push that causes it, instead of
    # at tag time. There is no tag to read on a push, so the version comes
    # from pyproject.toml.
    - name: Smoke-test the wheel
      run: |
        VERSION="$(poetry version --short)"
        python -m venv "$RUNNER_TEMP/wheel-test"
        "$RUNNER_TEMP/wheel-test/bin/pip" install dist/*.whl
        # Run from outside the checkout. The repository root contains
        # userprovided/, which sys.path[0] would put ahead of the installed
        # package -- the test would pass while testing the source tree.
        cd "$RUNNER_TEMP"
        VERSION="$VERSION" "$RUNNER_TEMP/wheel-test/bin/python" - <<'PY'
        import importlib.metadata, importlib.resources, os, userprovided
        assert importlib.metadata.version("userprovided") == os.environ["VERSION"]
        assert importlib.resources.files("userprovided").joinpath("py.typed").is_file()
        PY
