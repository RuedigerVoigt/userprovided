name: Coverage Check

on:
  # Only the long-lived branches: topic and dependabot branches live in this
  # repository, so a push there would run this twice -- once for the push and
  # once for the pull request.
  push:
    branches: [master, develop]
  pull_request:
  # Called by the release workflow, which gates publishing on this check.
  workflow_call:

# Superseded commits do not need to finish.
concurrency:
  # A literal, not github.workflow: that resolves to the *caller's* name when
  # one workflow calls another, so every check the release calls would share
  # one group and cancel its siblings.
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Install test tools
      run: |
        pip install hypothesis
        pip install pytest
        pip install pytest-cov

    - name: Install package
      run: pip install -e .

    - name: Run tests with coverage check (100% enforced)
      run: pytest --cov=userprovided --cov-fail-under=100 tests/
