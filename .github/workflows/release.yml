name: Release / Publish to PyPI

on:
  release:
    types: [published]


jobs:
  pypi-publish:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    if: github.event.release.target_commitish == 'master'
    # Specifying a GitHub environment is optional, but strongly encouraged
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # This job holds `id-token: write` and can mint a PyPI OIDC token, so the
      # tooling installed here is pinned to exact versions — the same reason the
      # actions above are pinned to commit SHAs instead of mutable tags.
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.4.1

      - name: Build package
        run: poetry build

      - name: Install Twine
        run: pip install twine==7.0.0

      - name: Validate built distributions with Twine
        run: twine check dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          attestations: true
