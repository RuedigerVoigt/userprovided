name: Release / Publish to PyPI

on:
  release:
    types: [published]


jobs:
  # A release can be published from any commit, and the checks below run on push
  # -- nothing guarantees they ever ran, or passed, for the commit being released.
  # Re-run them here as reusable workflows so a red commit cannot reach PyPI.
  tests:
    uses: ./.github/workflows/ubuntu-test.yml
  coverage:
    uses: ./.github/workflows/coverage.yml
  ruff:
    uses: ./.github/workflows/ruff.yml
  mypy:
    uses: ./.github/workflows/mypy.yml
  bandit:
    uses: ./.github/workflows/bandit.yml

  pypi-publish:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    needs: [tests, coverage, ruff, mypy, bandit]
    if: github.event.release.target_commitish == 'master'
    # Specifying a GitHub environment is optional, but strongly encouraged
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # This job holds `id-token: write` and can mint a PyPI OIDC token, so the
      # tooling installed here is pinned to exact versions — the same reason the
      # actions above are pinned to commit SHAs instead of mutable tags.
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.4.1

      # Without this, forgetting the version bump only surfaces as a rejected
      # upload after the build, and a mismatched tag would publish silently.
      # Tags exist both as '2.5.0' and 'v2.6.0', so strip an optional leading v.
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(poetry version --short)"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $PKG"
            exit 1
          fi

      - name: Build package
        run: poetry build

      - name: Install Twine
        run: pip install twine==7.0.0

      - name: Validate built distributions with Twine
        run: twine check dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          attestations: true
