name: Release / Publish to PyPI

on:
  release:
    types: [published]


jobs:
  # A release can be published from any commit, and the checks below run on push
  # -- nothing guarantees they ever ran, or passed, for the commit being released.
  # Re-run them here as reusable workflows so a red commit cannot reach PyPI.
  tests:
    uses: ./.github/workflows/ubuntu-test.yml
  coverage:
    uses: ./.github/workflows/coverage.yml
  ruff:
    uses: ./.github/workflows/ruff.yml
  mypy:
    uses: ./.github/workflows/mypy.yml
  bandit:
    uses: ./.github/workflows/bandit.yml
  doctest:
    uses: ./.github/workflows/doctest.yml

  # Everything that installs third-party code runs here, without the OIDC
  # token: pinning poetry and twine to exact versions does not pin the ~90
  # transitive packages pip resolves for them, and any of those executes code
  # during installation. The distributions travel to the publishing job as an
  # artifact instead.
  build:
    name: build the distributions
    runs-on: ubuntu-latest
    needs: [tests, coverage, ruff, mypy, bandit, doctest]
    if: github.event.release.target_commitish == 'master'
    permissions:
      contents: read
    steps:
      # Actions are pinned to commit SHAs instead of mutable tags, so a
      # retagged upstream release cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.4.1

      # Without this, forgetting the version bump only surfaces as a rejected
      # upload after the build, and a mismatched tag would publish silently.
      # Tags exist both as '2.5.0' and 'v2.6.0', so strip an optional leading v.
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(poetry version --short)"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $PKG"
            exit 1
          fi

      - name: Build package
        run: poetry build

      - name: Install Twine
        run: pip install twine==7.0.0

      # --strict promotes warnings to errors: a README that renders badly on
      # PyPI is only a warning by default, and PyPI will not let it be fixed
      # without a new version. The counts guard the globs below, which would
      # otherwise silently pick up a second artifact.
      - name: Validate built distributions with Twine
        run: |
          twine check --strict dist/*
          test "$(ls dist/*.whl | wc -l)" -eq 1
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1

      # The tag check above compares the tag to pyproject.toml, so it only
      # proves the source is consistent. These two compare it to what the
      # artifacts actually install.
      - name: Smoke-test the wheel
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/pip" install dist/*.whl
          # Run from outside the checkout. The repository root contains
          # userprovided/, which sys.path[0] would put ahead of the installed
          # package -- the test would pass while testing the source tree.
          cd "$RUNNER_TEMP"
          VERSION="$VERSION" "$RUNNER_TEMP/wheel-test/bin/python" - <<'PY'
          import importlib.metadata, importlib.resources, os, userprovided
          assert importlib.metadata.version("userprovided") == os.environ["VERSION"]
          assert importlib.resources.files("userprovided").joinpath("py.typed").is_file()
          PY

      # Rebuilding from the sdist is what catches a file missing from it.
      # py.typed is the one that fails silently: type checking stops working
      # for every downstream user without an import error anywhere.
      - name: Rebuild from the sdist and smoke-test that
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir "$RUNNER_TEMP/from-sdist"
          python -m venv "$RUNNER_TEMP/sdist-test"
          "$RUNNER_TEMP/sdist-test/bin/pip" install "$RUNNER_TEMP"/from-sdist/*.whl
          cd "$RUNNER_TEMP"
          VERSION="$VERSION" "$RUNNER_TEMP/sdist-test/bin/python" - <<'PY'
          import importlib.metadata, importlib.resources, os
          assert importlib.metadata.version("userprovided") == os.environ["VERSION"]
          assert importlib.resources.files("userprovided").joinpath("py.typed").is_file()
          PY

      - name: Store the distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  # Only this job can mint a PyPI OIDC token, so it holds two steps and no
  # third-party code: no checkout, no package installs, nothing that could
  # read the token out of the runner environment.
  pypi-publish:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    needs: build
    # Repeated from the build job so this gate does not depend on reading
    # another job's definition.
    if: github.event.release.target_commitish == 'master'
    # Specifying a GitHub environment is optional, but strongly encouraged
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          # gh-action-pypi-publish reads from dist/ by default.
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
