version: 2
updates:
  # Keep the GitHub Actions used in the workflows up to date.
  # The library itself has no runtime dependencies, so there is no
  # pip/poetry ecosystem to watch here.
  - package-ecosystem: "github-actions"
    directory: "/"
    # Without this, Dependabot opens against the default branch (master),
    # which contradicts the rule that every PR targets develop.
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # init, autobuild and analyze must run the same version, or the
    # analyze step fails. Bump them together in a single PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
