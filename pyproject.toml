[tool.poetry]
name = "userprovided"
version = "3.0.0"
description = "Validate, normalize, and convert user input: URLs, emails, dates, hashes, parameters — pure stdlib, no dependencies"
authors = ["Rüdiger Voigt <projects@ruediger-voigt.eu>"]
readme = "README.md"
license = "Apache-2.0"
packages = [{include = "userprovided"}]
keywords = ["validation", "input", "sanitization", "url", "normalize", "hashing", "email", "parameters", "user-input", "type-checking", "finance", "data-cleaning", "no-dependencies"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Utilities",
    "Topic :: Software Development :: Quality Assurance"
]
include = ["userprovided/py.typed"]

[tool.poetry.urls]
Homepage = "https://github.com/RuedigerVoigt/userprovided"
Documentation = "https://github.com/RuedigerVoigt/userprovided#readme"
Repository = "https://github.com/RuedigerVoigt/userprovided"
Changelog = "https://github.com/RuedigerVoigt/userprovided/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/RuedigerVoigt/userprovided/issues"

[tool.poetry.dependencies]
python = ">=3.10"

[tool.poetry.group.dev.dependencies]
hypothesis = "*"
pytest = "*"
ruff = "*"
mypy = "*"
bandit = "*"

[tool.mypy]
# Type-check the library only. Tests are deliberately not type-checked
# (matches CI, which runs mypy on userprovided/ only).
files = ["userprovided"]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
# pycodestyle (E/W), pyflakes (F), mccabe (C90) and pyupgrade (UP)
select = ["E", "W", "F", "C90", "UP"]

[tool.ruff.lint.mccabe]
# Several validators are inherently branchy. This threshold passes today
# and still flags future regressions; lower it deliberately, not by accident.
max-complexity = 15

[tool.pytest.ini_options]
console_output_style = "classic"
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
cover_pylib = false
source = ["userprovided"]

[tool.coverage.html]
title = "Coverage Report for the userprovided Python Package"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
