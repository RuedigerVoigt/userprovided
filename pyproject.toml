[project]
name = "userprovided"
version = "3.0.0"
description = "Validate, normalize, and convert user input: URLs, emails, dates, hashes, parameters — pure stdlib, no dependencies"
authors = [{name = "Rüdiger Voigt", email = "projects@ruediger-voigt.eu"}]
readme = "README.md"
requires-python = ">=3.11"
# PEP 639: an SPDX expression plus the license file, not the deprecated
# free-text 'License:' field and 'License ::' classifier. PyPI rejects a
# distribution that carries both a License-Expression and a license
# classifier, so the classifier must stay out of the list below.
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["validation", "input", "sanitization", "url", "normalize", "hashing", "email", "parameters", "user-input", "type-checking", "finance", "data-cleaning", "no-dependencies"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Utilities",
    "Topic :: Software Development :: Quality Assurance"
]

[project.urls]
Homepage = "https://github.com/RuedigerVoigt/userprovided"
Documentation = "https://github.com/RuedigerVoigt/userprovided#readme"
Repository = "https://github.com/RuedigerVoigt/userprovided"
Changelog = "https://github.com/RuedigerVoigt/userprovided/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/RuedigerVoigt/userprovided/issues"

[tool.poetry]
packages = [{include = "userprovided"}]
include = ["userprovided/py.typed"]

[tool.poetry.group.dev.dependencies]
hypothesis = "*"
pytest = "*"
ruff = "*"
mypy = "*"
bandit = "*"

[tool.mypy]
# Type-check the library only. Tests are deliberately not type-checked
# (matches CI, which runs mypy on userprovided/ only).
files = ["userprovided"]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
# pycodestyle (E/W), pyflakes (F), mccabe (C90) and pyupgrade (UP)
select = ["E", "W", "F", "C90", "UP"]

[tool.ruff.lint.mccabe]
# Several validators are inherently branchy. This threshold passes today
# and still flags future regressions; lower it deliberately, not by accident.
max-complexity = 15

[tool.pytest.ini_options]
console_output_style = "classic"
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
cover_pylib = false
source = ["userprovided"]

[tool.coverage.html]
title = "Coverage Report for the userprovided Python Package"

[build-system]
# 2.2.0 is the first release that emits License-Expression instead of the
# deprecated free-text 'License:' field; 2.1.x still writes metadata 2.3.
# The upper bound keeps an isolated build from picking a future major
# version whose output nobody has checked.
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
